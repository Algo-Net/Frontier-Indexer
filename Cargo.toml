[package]
name = "indexer"
version = "0.3.9"
edition = "2024"

[dependencies]
tokio = "=1.52.1"
anyhow = "1.0.71"
tracing = "0.1.37"
async-trait = "0.1.61"
bcs = "0.1.4"
url = "2.3.1"
dotenvy = "0.15"
hex = "0.4.3"
bigdecimal = "0.4"
strum_macros = "0.27.1"
futures = "0.3.28"
http = "1.4.1"

serde = { version = "1.0.144", features = ["derive", "rc"] }
serde_json = { version = "1.0.95", features = ["preserve_order"] }
clap = { version = "4.4", features = ["derive", "wrap_help"] }
prometheus = { version = "0.14", features = ["protobuf"] }
strum = { version = "0.27.1", features = ["derive"] }
toml = { version = "0.8", features = ["parse"] }
tower-http = { version = "0.6.11", features = ["cors"] }
reqwest = { version = "0.12", default-features = false, features = [
  "http2",
  "json",
  "rustls-tls",
] }
axum = { version = "0.8", default-features = false, features = [
  "macros",
  "tokio",
  "http1",
  "http2",
  "json",
  "matched-path",
  "original-uri",
  "form",
  "query",
  "ws",
] }

# References forked sui with custom framework
sui-pg-db = { git = "https://github.com/Algo-Net/sui.git", branch = "testnet-indexer-0.4.0" }
sui-types = { git = "https://github.com/Algo-Net/sui.git", branch = "testnet-indexer-0.4.0" }
move-core-types = { git = "https://github.com/Algo-Net/sui.git", branch = "testnet-indexer-0.4.0" }
telemetry-subscribers = { git = "https://github.com/Algo-Net/sui.git", branch = "testnet-indexer-0.4.0" }
sui-indexer-alt-metrics = { git = "https://github.com/Algo-Net/sui.git", branch = "testnet-indexer-0.4.0" }
sui-indexer-alt-framework = { git = "https://github.com/Algo-Net/sui.git", branch = "testnet-indexer-0.4.0" }
sui-indexer-alt-framework-store-traits = { git = "https://github.com/Algo-Net/sui.git", branch = "testnet-indexer-0.4.0" }
sui-transaction-builder = { git = "https://github.com/Algo-Net/sui.git", branch = "testnet-indexer-0.4.0" }

sui-sdk-types = { git = "https://github.com/MystenLabs/sui-rust-sdk.git", rev = "788907487b40bc341bd90ee26428c4098fc1e515", features = [ "hash", "serde" ] }
sui-crypto = { git = "https://github.com/MystenLabs/sui-rust-sdk.git", rev = "788907487b40bc341bd90ee26428c4098fc1e515", features = [ "ed25519", "secp256r1", "secp256k1", "passkey", "zklogin" ] }
sui-rpc = { git = "https://github.com/MystenLabs/sui-rust-sdk.git", rev = "788907487b40bc341bd90ee26428c4098fc1e515", features = [ "unstable" ] }

# Database
chrono = { version = "0.4.44", features = ["clock", "serde"] }
diesel = { version = "2.3", features = ["postgres", "r2d2", "chrono"] }
diesel_migrations = "2.3"
diesel-async = { version = "0.9", features = ["bb8", "postgres", "async-connection-wrapper"] }

# Transports
async-nats = "0.38"
lapin = "2"
deadpool-lapin = { version  = "0.12", features = ["rt_tokio_1"] }
socketioxide = { version  = "0.15", features = ["v4"] }
redis = { version  = "0.27", features = ["tokio-comp", "connection-manager"] }

[dev-dependencies]
chrono = "0.4.39"
serde_json = "1.0.140"

insta = { version = "1.43.1", features = ["json"] }
sqlx = { version = "0.8.3", features = ["runtime-tokio", "postgres", "chrono", "bigdecimal"] }
fastcrypto = { git = "https://github.com/MystenLabs/fastcrypto", rev = "4db0e90c732bbf7420ca20de808b698883148d9c" }

sui-storage = { git = "https://github.com/Algo-Net/sui.git", branch = "testnet-indexer-0.4.0" }

[[bin]]
name = "indexer"
path = "src/main.rs"
